plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Flutter plugin
    id "com.google.gms.google-services"    // ✅ Firebase plugin (correct)
}

android {
    namespace = "com.example.task_buddy"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

   defaultConfig {
    applicationId = "com.example.task_buddy"
    minSdk = 21                       // ✅ Sahi value
    targetSdk = flutter.targetSdkVersion
    versionCode = flutter.versionCode
    versionName = flutter.versionName
}

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 1️⃣ Firebase BOM: version manager
    implementation platform('com.google.firebase:firebase-bom:33.15.0')

    // 2️⃣ Firebase Auth dependency
    implementation 'com.google.firebase:firebase-auth'

    // (Optional) Firebase Analytics (agar chahiye)
    // implementation 'com.google.firebase:firebase-analytics'
}